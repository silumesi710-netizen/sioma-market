<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiomaMarket - Local Marketplace</title>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* --- CSS STYLES --- */
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.5; padding-bottom: 60px; }

    /* Header & Navigation */
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; padding: 0.75rem 1rem; }
    .header-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); text-decoration: none; cursor: pointer; }
    
    .nav-btns { display: flex; gap: 0.75rem; align-items: center; }
    .btn { padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; font-weight: 500; font-size: 0.875rem; transition: background 0.2s; }
    .btn:hover { background: #f1f5f9; }
    .btn-primary { background: var(--primary); color: white; border: none; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--danger); color: white; border: none; }
    .badge { background: var(--danger); color: white; border-radius: 9999px; padding: 0.1rem 0.4rem; font-size: 0.75rem; font-weight: 700; margin-left: 0.25rem; }

    /* Layout & Containers */
    main { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }
    .page-section { display: none; }
    .page-section.active { display: block; }

    /* Controls & Filters */
    .controls-bar { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .search-input, .select-input, .form-input { padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.875rem; flex: 1; min-width: 200px; }

    /* Product Grid & Cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.25rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.1s; }
    .card:hover { transform: translateY(-2px); }
    .card-img { width: 100%; height: 180px; object-fit: cover; background-color: #e2e8f0; }
    .card-body { padding: 0.75rem; display: flex; flex-direction: column; flex: 1; }
    .card-price { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
    .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.25rem; color: var(--text); }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 0.5rem; font-size: 0.75rem; color: var(--text-muted); }

    /* Forms & Modal UI */
    .form-container { max-width: 500px; margin: 2rem auto; background: var(--card-bg); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border); }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.25rem; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; }
    
    /* Messaging UI */
    .chat-container { display: flex; height: 500px; border: 1px solid var(--border); border-radius: 8px; background: var(--card-bg); overflow: hidden; }
    .chat-sidebar { width: 30%; border-right: 1px solid var(--border); overflow-y: auto; }
    .chat-main { width: 70%; display: flex; flex-direction: column; }
    .chat-item { padding: 0.75rem; border-bottom: 1px solid var(--border); cursor: pointer; }
    .chat-item:hover, .chat-item.active { background: #f1f5f9; }
    .chat-messages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; }
    .message { max-width: 70%; padding: 0.5rem 0.75rem; border-radius: 8px; font-size: 0.875rem; }
    .message.sent { align-self: flex-end; background: var(--primary); color: white; }
    .message.received { align-self: flex-start; background: #e2e8f0; color: var(--text); }
    .chat-input-area { display: flex; gap: 0.5rem; padding: 0.75rem; border-top: 1px solid var(--border); }

    /* Modal Overlay */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 200; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card-bg); padding: 1.5rem; border-radius: 8px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body>

  <!-- Navigation Header -->
  <header>
    <div class="header-container">
      <div class="logo" onclick="navigateTo('homePage')">SiomaMarket</div>
      <div class="nav-btns">
        <button class="btn" onclick="navigateTo('homePage')">Browse</button>
        <button class="btn" id="favsBtn" onclick="navigateTo('favsPage')" style="display:none;">Favorites</button>
        <button class="btn" id="messagesBtn" onclick="navigateTo('messagesPage')" style="display:none;">
          Messages <span id="msgCounter" class="badge" style="display:none;">0</span>
        </button>
        <button class="btn btn-primary" id="sellBtn" onclick="navigateTo('createListingPage')" style="display:none;">+ Sell</button>
        <button class="btn" id="authBtn" onclick="navigateTo('authPage')">Login</button>
        <button class="btn btn-danger" id="logoutBtn" onclick="handleLogout()" style="display:none;">Logout</button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main>
    <!-- Home / Product Catalog -->
    <section id="homePage" class="page-section active">
      <div class="controls-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search items..." oninput="handleSearch()">
        <select id="categorySelect" class="select-input" onchange="handleSearch()">
          <option value="">All Categories</option>
          <option value="Electronics">Electronics</option>
          <option value="Vehicles">Vehicles</option>
          <option value="Property">Property</option>
          <option value="Fashion">Fashion</option>
          <option value="Home & Garden">Home & Garden</option>
        </select>
      </div>
      <div id="listingsGrid" class="grid"></div>
    </section>

    <!-- Create Listing Form -->
    <section id="createListingPage" class="page-section">
      <div class="form-container">
        <h2>Post New Listing</h2>
        <form id="createListingForm" onsubmit="handleCreateListing(event)" style="margin-top: 1rem;">
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="listTitle" class="form-input" required>
          </div>
          <div class="form-group">
            <label>Price ($)</label>
            <input type="number" step="0.01" id="listPrice" class="form-input" required>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="listCategory" class="select-input" required>
              <option value="Electronics">Electronics</option>
              <option value="Vehicles">Vehicles</option>
              <option value="Property">Property</option>
              <option value="Fashion">Fashion</option>
              <option value="Home & Garden">Home & Garden</option>
            </select>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="listDesc" class="form-input" rows="4" required></textarea>
          </div>
          <div class="form-group">
            <label>Image URL</label>
            <input type="url" id="listImageUrl" class="form-input" placeholder="https://example.com/image.jpg" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Publish Listing</button>
        </form>
      </div>
    </section>

    <!-- Auth Page -->
    <section id="authPage" class="page-section">
      <div class="form-container">
        <h2 id="authTitle">Sign In</h2>
        <form id="authForm" onsubmit="handleAuthSubmit(event)" style="margin-top: 1rem;">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="authEmail" class="form-input" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="authPassword" class="form-input" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;" id="authSubmitBtn">Login</button>
        </form>
        <p style="margin-top: 1rem; text-align: center; font-size: 0.875rem;">
          <span id="authToggleText">Need an account?</span> 
          <a href="#" onclick="toggleAuthMode(event)" id="authToggleLink">Register</a>
        </p>
      </div>
    </section>

    <!-- Favorites Page -->
    <section id="favsPage" class="page-section">
      <h2 style="margin-bottom: 1rem;">Your Favorites</h2>
      <div id="favsGrid" class="grid"></div>
    </section>

    <!-- Messages Page -->
    <section id="messagesPage" class="page-section">
      <div class="chat-container">
        <div class="chat-sidebar" id="conversationsList"></div>
        <div class="chat-main">
          <div class="chat-messages" id="chatMessages">
            <p style="color: var(--text-muted); text-align: center; margin-auto;">Select a conversation to start chatting.</p>
          </div>
          <div class="chat-input-area" id="chatInputArea" style="display: none;">
            <input type="text" id="chatInput" class="form-input" placeholder="Type a message...">
            <button class="btn btn-primary" onclick="sendMessage()">Send</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Product Detail Modal -->
  <div id="productModal" class="modal">
    <div class="modal-content">
      <button class="btn" style="float: right;" onclick="closeModal()">✕</button>
      <div id="modalDetails"></div>
    </div>
  </div>

  <!-- --- JAVASCRIPT APPLICATION --- -->
  <script>
    /* ==========================================================================
       SECTION 1 & 2: CONFIGURATION & INITIALIZATION
       ========================================================================== */
    const SUPABASE_URL = "https://your-supabase-project-url.supabase.co";
    const SUPABASE_KEY = "your-anon-public-key";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    /* Helper Shortcut */
    const $ = (id) => document.getElementById(id);

    /* Dynamic HTML Sanitization Helper */
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /* ==========================================================================
       SECTION 3: GLOBAL STATE
       ========================================================================== */
    let currentUser = null;
    let sessionLoaded = false;
    let isAuthRegisterMode = false;
    let favoriteListingIds = new Set();
    
    // Explicit messaging state variables
    let currentConversationId = null;
    let currentConversationListingId = null;
    let currentConversationRecipientId = null;

    let counterInterval = null;

    /* ==========================================================================
       SECTION 4: ROUTING & NAVIGATION
       ========================================================================== */
    function navigateTo(pageId) {
      document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
      const target = $(pageId);
      if (target) {
        target.classList.add('active');
      }

      if (pageId === 'homePage') loadListings();
      if (pageId === 'favsPage') loadFavorites();
      if (pageId === 'messagesPage') loadConversations();
    }

    /* ==========================================================================
       SECTION 5: AUTHENTICATION HANDLING
       ========================================================================== */
    function toggleAuthMode(e) {
      if (e) e.preventDefault();
      isAuthRegisterMode = !isAuthRegisterMode;
      $('authTitle').innerText = isAuthRegisterMode ? 'Create Account' : 'Sign In';
      $('authSubmitBtn').innerText = isAuthRegisterMode ? 'Register' : 'Login';
      $('authToggleText').innerText = isAuthRegisterMode ? 'Already have an account?' : 'Need an account?';
      $('authToggleLink').innerText = isAuthRegisterMode ? 'Login' : 'Register';
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = $('authEmail').value;
      const password = $('authPassword').value;

      try {
        if (isAuthRegisterMode) {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) throw error;
          alert('Registration successful! Please log in.');
          toggleAuthMode();
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          navigateTo('homePage');
        }
      } catch (err) {
        alert(err.message);
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      navigateTo('homePage');
    }

    async function handleUserSessionChanged() {
      if (currentUser) {
        $('authBtn').style.display = 'none';
        $('logoutBtn').style.display = 'inline-block';
        $('sellBtn').style.display = 'inline-block';
        $('favsBtn').style.display = 'inline-block';
        $('messagesBtn').style.display = 'inline-block';
        await loadFavoriteIds();
      } else {
        $('authBtn').style.display = 'inline-block';
        $('logoutBtn').style.display = 'none';
        $('sellBtn').style.display = 'none';
        $('favsBtn').style.display = 'none';
        $('messagesBtn').style.display = 'none';
        favoriteListingIds.clear();
      }
    }

    /* Single Clean Auth Listener Initialization */
    supabaseClient.auth.onAuthStateChange((event, session) => {
      currentUser = session?.user || null;
      sessionLoaded = true;
      setTimeout(async () => {
        try {
          await handleUserSessionChanged();
          if (currentUser) {
            startCounterRefresh();
          } else {
            stopCounterRefresh();
          }
        } catch (error) {
          console.error("Auth UI refresh error:", error);
        }
      }, 0);
    });

    /* ==========================================================================
       SECTION 6: LISTINGS & FAVORITES
       ========================================================================== */
    async function loadListings() {
      const queryText = $('searchInput').value;
      const category = $('categorySelect').value;

      let query = supabaseClient.from('listings').select('*').order('created_at', { ascending: false });

      if (category) query = query.eq('category', category);
      if (queryText) query = query.ilike('title', `%${queryText}%`);

      const { data, error } = await query;
      if (error) return console.error(error);

      renderListingsGrid(data, $('listingsGrid'));
    }

    function renderListingsGrid(listings, container) {
      container.innerHTML = '';
      if (!listings || listings.length === 0) {
        container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No listings found.</p>';
        return;
      }

      listings.forEach(item => {
        const isFav = favoriteListingIds.has(item.id);
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openProductModal(item);
        card.innerHTML = `
          <img class="card-img" src="${escapeHtml(item.image_url)}" alt="${escapeHtml(item.title)}">
          <div class="card-body">
            <div class="card-price">$${Number(item.price).toFixed(2)}</div>
            <div class="card-title">${escapeHtml(item.title)}</div>
            <div class="card-footer">
              <span>${escapeHtml(item.category)}</span>
              ${currentUser ? `<button class="btn" onclick="event.stopPropagation(); toggleFavorite('${item.id}')">${isFav ? '❤️' : '🤍'}</button>` : ''}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function handleSearch() {
      loadListings();
    }

    async function handleCreateListing(e) {
      e.preventDefault();
      if (!currentUser) return alert('You must be logged in to post listings.');

      const payload = {
        seller_id: currentUser.id,
        title: $('listTitle').value,
        price: parseFloat($('listPrice').value),
        category: $('listCategory').value,
        description: $('listDesc').value,
        image_url: $('listImageUrl').value,
        status: 'active'
      };

      const { error } = await supabaseClient.from('listings').insert([payload]);
      if (error) {
        alert(error.message);
      } else {
        alert('Listing published successfully!');
        $('createListingForm').reset();
        navigateTo('homePage');
      }
    }

    async function loadFavoriteIds() {
      if (!currentUser) return;
      const { data } = await supabaseClient.from('favorites').select('listing_id').eq('user_id', currentUser.id);
      if (data) {
        favoriteListingIds = new Set(data.map(f => f.listing_id));
      }
    }

    async function toggleFavorite(listingId) {
      if (!currentUser) return;

      if (favoriteListingIds.has(listingId)) {
        await supabaseClient.from('favorites').delete().eq('user_id', currentUser.id).eq('listing_id', listingId);
        favoriteListingIds.delete(listingId);
      } else {
        await supabaseClient.from('favorites').insert([{ user_id: currentUser.id, listing_id: listingId }]);
        favoriteListingIds.add(listingId);
      }
      loadListings();
      if ($('favsPage').classList.contains('active')) loadFavorites();
    }

    async function loadFavorites() {
      if (!currentUser) return;
      const { data } = await supabaseClient.from('favorites').select('listing_id, listings(*)').eq('user_id', currentUser.id);
      const listings = data ? data.map(d => d.listings).filter(Boolean) : [];
      renderListingsGrid(listings, $('favsGrid'));
    }

    function openProductModal(item) {
      const modal = $('productModal');
      $('modalDetails').innerHTML = `
        <img src="${escapeHtml(item.image_url)}" style="width:100%; max-height: 300px; object-fit: cover; border-radius:6px; margin-bottom:1rem;">
        <h2>${escapeHtml(item.title)}</h2>
        <h3 style="color:var(--primary); margin:0.5rem 0;">$${Number(item.price).toFixed(2)}</h3>
        <p><strong>Category:</strong> ${escapeHtml(item.category)}</p>
        <p style="margin-top:0.5rem;">${escapeHtml(item.description)}</p>
        ${currentUser && currentUser.id !== item.seller_id ? 
          `<button class="btn btn-primary" style="margin-top:1rem; width:100%;" onclick="messageSeller('${item.id}', '${item.seller_id}')">Contact Seller</button>` : ''}
      `;
      modal.classList.add('active');
    }

    function closeModal() {
      $('productModal').classList.remove('active');
    }

    /* ==========================================================================
       SECTION 7: MESSAGING SYSTEM
       ========================================================================== */
    function getConversationRecipient() {
      return currentConversationRecipientId || null;
    }

    async function messageSeller(listingId, sellerId) {
      closeModal();
      if (!currentUser) return navigateTo('authPage');
      if (sellerId === currentUser.id) return alert("You cannot message yourself.");

      openConversation(sellerId, sellerId, listingId);
      navigateTo('messagesPage');
    }

    async function openConversation(conversationId, otherUserId, listingId = null) {
      currentConversationId = conversationId;
      currentConversationListingId = listingId;
      currentConversationRecipientId = otherUserId;

      $('chatInputArea').style.display = 'flex';
      await loadConversationMessages(otherUserId, listingId);
    }

    async function loadConversations() {
      if (!currentUser) return;
      const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
        .order('created_at', { ascending: false });

      if (error) return console.error(error);

      const conversationsMap = new Map();
      data.forEach(msg => {
        const otherId = msg.sender_id === currentUser.id ? msg.receiver_id : msg.sender_id;
        if (!conversationsMap.has(otherId)) {
          conversationsMap.set(otherId, msg);
        }
      });

      const listContainer = $('conversationsList');
      listContainer.innerHTML = '';

      conversationsMap.forEach((lastMsg, otherId) => {
        const item = document.createElement('div');
        item.className = `chat-item ${currentConversationRecipientId === otherId ? 'active' : ''}`;
        item.onclick = () => openConversation(otherId, otherId, lastMsg.listing_id);
        item.innerHTML = `
          <strong>User ID: ...${otherId.slice(-6)}</strong>
          <p style="font-size:0.75rem; color:var(--text-muted); text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">
            ${escapeHtml(lastMsg.content)}
          </p>
        `;
        listContainer.appendChild(item);
      });
    }

    async function loadConversationMessages(recipientId, listingId) {
      if (!currentUser || !recipientId) return;

      const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${recipientId}),and(sender_id.eq.${recipientId},receiver_id.eq.${currentUser.id})`)
        .order('created_at', { ascending: true });

      if (error) return console.error(error);

      const msgContainer = $('chatMessages');
      msgContainer.innerHTML = '';

      data.forEach(msg => {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${msg.sender_id === currentUser.id ? 'sent' : 'received'}`;
        msgDiv.innerText = msg.content;
        msgContainer.appendChild(msgDiv);
      });

      msgContainer.scrollTop = msgContainer.scrollHeight;
    }

    async function sendMessage() {
      const recipientId = getConversationRecipient();
      const content = $('chatInput').value.trim();

      if (!recipientId) return alert('Unable to identify the recipient.');
      if (!content) return;

      const payload = {
        sender_id: currentUser.id,
        receiver_id: recipientId,
        listing_id: currentConversationListingId,
        content: content
      };

      const { error } = await supabaseClient.from('messages').insert([payload]);
      if (error) {
        alert(error.message);
      } else {
        $('chatInput').value = '';
        loadConversationMessages(recipientId, currentConversationListingId);
        loadConversations();
      }
    }

    /* ==========================================================================
       SECTION 8 & 9: COUNTERS & VISIBILITY SYNC
       ========================================================================== */
    async function updateAllCounters() {
      if (!currentUser) return;
      const { count, error } = await supabaseClient
        .from('messages')
        .select('*', { count: 'exact', head: true })
        .eq('receiver_id', currentUser.id)
        .eq('is_read', false);

      if (!error && count !== null) {
        const badge = $('msgCounter');
        if (count > 0) {
          badge.innerText = count;
          badge.style.display = 'inline-block';
        } else {
          badge.style.display = 'none';
        }
      }
    }

    function startCounterRefresh() {
      updateAllCounters();
      if (!counterInterval) {
        counterInterval = setInterval(updateAllCounters, 15000);
      }
    }

    function stopCounterRefresh() {
      if (counterInterval) {
        clearInterval(counterInterval);
        counterInterval = null;
      }
    }

    function handleVisibilityChange() {
      if (!document.hidden && currentUser) {
        updateAllCounters();
        const messagesPage = $('messagesPage');
        if (currentConversationRecipientId && messagesPage && messagesPage.classList.contains('active')) {
          loadConversationMessages(currentConversationRecipientId, currentConversationListingId);
        }
      }
    }

    document.addEventListener('visibilitychange', handleVisibilityChange);

    /* Initial Application Entry Point */
    loadListings();
  </script>
</body>
</html>
