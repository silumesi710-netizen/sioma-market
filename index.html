<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SiomaMarket 🇿🇲 | Buy & Sell Locally</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

:root{
    --green:#087443;
    --green2:#0a9255;
    --dark:#10251b;
    --yellow:#f7c843;
    --red:#d92323;
    --white:#fff;
    --gray:#667085;
    --light:#eef3f0;
    --border:#dfe5e2;
    --shadow:0 8px 25px rgba(0,0,0,.08);
}

/* HEADER */

header{
    background:linear-gradient(135deg,#087443,#0a9255);
    color:white;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 4px 18px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1250px;
    margin:auto;
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:18px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:max-content;
}

.logo-icon{
    width:45px;
    height:45px;
    background:white;
    color:var(--green);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:bold;
}

.logo-text{
    font-size:22px;
    font-weight:800;
}

.logo-sub{
    font-size:10px;
    opacity:.85;
}

.search-box{
    flex:1;
    display:flex;
    background:white;
    border-radius:10px;
    overflow:hidden;
}

.search-box input{
    width:100%;
    border:0;
    outline:0;
    padding:12px 14px;
    color:#222;
}

.search-box button{
    border:0;
    background:var(--yellow);
    color:#172033;
    padding:0 18px;
    font-weight:bold;
}

.header-actions{
    display:flex;
    gap:8px;
}

.header-btn{
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.12);
    color:white;
    border-radius:9px;
    padding:10px 13px;
    font-weight:bold;
}

.header-btn:hover{
    background:rgba(255,255,255,.22);
}

/* HERO */

.hero{
    background:white;
    border-bottom:1px solid var(--border);
}

.hero-inner{
    max-width:1250px;
    margin:auto;
    padding:28px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.hero h1{
    font-size:30px;
    margin-bottom:7px;
}

.hero p{
    color:var(--gray);
}

.sell-btn{
    background:var(--green);
    color:white;
    border:0;
    border-radius:10px;
    padding:13px 20px;
    font-weight:bold;
}

/* FILTERS */

.filters{
    max-width:1250px;
    margin:20px auto;
    padding:0 18px;
}

.filter-panel{
    background:white;
    padding:16px;
    border-radius:14px;
    box-shadow:var(--shadow);
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr 1fr auto;
    gap:10px;
}

.filter-panel input,
.filter-panel select{
    width:100%;
    padding:11px;
    border:1px solid var(--border);
    border-radius:8px;
    outline:none;
}

.filter-btn{
    border:0;
    background:var(--green);
    color:white;
    border-radius:8px;
    padding:0 18px;
    font-weight:bold;
}

/* MAIN */

main{
    max-width:1250px;
    margin:0 auto;
    padding:0 18px 50px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:25px 0 15px;
}

.section-title h2{
    font-size:22px;
}

.results-count{
    color:var(--gray);
    font-size:14px;
}

/* PRODUCTS */

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.product-card{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:var(--shadow);
    border:1px solid #e7ebe9;
    transition:.2s;
}

.product-card:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(0,0,0,.12);
}

.product-image{
    width:100%;
    height:210px;
    object-fit:cover;
    background:#eef2ef;
}

.product-content{
    padding:14px;
}

.product-title{
    font-size:17px;
    font-weight:700;
    margin-bottom:6px;
    line-height:1.3;
}

.product-price{
    color:var(--green);
    font-size:19px;
    font-weight:800;
    margin-bottom:7px;
}

.product-location{
    color:var(--gray);
    font-size:13px;
    margin-bottom:5px;
}

.product-seller{
    color:#555;
    font-size:13px;
    margin-bottom:12px;
}

.product-actions{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
}

.action-btn{
    border:1px solid var(--border);
    background:#fff;
    padding:9px 5px;
    border-radius:8px;
    font-size:12px;
    font-weight:bold;
}

.action-btn:hover{
    background:#f3f7f5;
}

.favorite.active{
    color:var(--red);
    border-color:#f1bbbb;
    background:#fff5f5;
}

.share-btn{
    color:var(--green);
}

.message-btn{
    background:var(--green);
    color:white;
    border-color:var(--green);
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:2000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:520px;
    background:white;
    border-radius:16px;
    padding:22px;
    max-height:90vh;
    overflow:auto;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.close-btn{
    border:0;
    background:#eee;
    width:35px;
    height:35px;
    border-radius:50%;
}

.form-group{
    margin-bottom:13px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    font-size:14px;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    border:1px solid var(--border);
    border-radius:8px;
    padding:11px;
    outline:none;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.primary-btn{
    width:100%;
    border:0;
    background:var(--green);
    color:white;
    padding:12px;
    border-radius:9px;
    font-weight:bold;
}

/* SHARE */

.share-options{
    display:grid;
    gap:10px;
}

.share-option{
    width:100%;
    border:1px solid var(--border);
    background:white;
    padding:13px;
    border-radius:9px;
    text-align:left;
    font-weight:bold;
}

.share-option:hover{
    background:#f3f7f5;
}

.share-preview{
    background:#f5f7fb;
    padding:12px;
    border-radius:9px;
    margin-bottom:14px;
    font-size:14px;
}

/* MESSAGES */

.message-list{
    max-height:350px;
    overflow:auto;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
    margin-bottom:12px;
}

.message{
    padding:9px;
    border-radius:9px;
    background:#f2f5f3;
    margin-bottom:8px;
}

.message.mine{
    background:#dff3e8;
    text-align:right;
}

/* AUTH */

.auth-tabs{
    display:flex;
    margin-bottom:18px;
    border-bottom:1px solid var(--border);
}

.auth-tab{
    flex:1;
    border:0;
    background:white;
    padding:11px;
    font-weight:bold;
}

.auth-tab.active{
    color:var(--green);
    border-bottom:3px solid var(--green);
}

/* TOAST */

.toast{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%) translateY(100px);
    background:#172033;
    color:white;
    padding:12px 18px;
    border-radius:9px;
    z-index:5000;
    opacity:0;
    transition:.3s;
}

.toast.show{
    transform:translateX(-50%) translateY(0);
    opacity:1;
}

/* EMPTY */

.empty{
    grid-column:1/-1;
    background:white;
    border-radius:14px;
    padding:45px 20px;
    text-align:center;
    color:var(--gray);
}

/* FOOTER */

footer{
    background:#10251b;
    color:white;
    padding:30px 18px;
    text-align:center;
}

footer strong{
    color:var(--yellow);
}

/* RESPONSIVE */

@media(max-width:1000px){
    .products{
        grid-template-columns:repeat(3,1fr);
    }

    .filter-panel{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:700px){
    .header-inner{
        flex-wrap:wrap;
    }

    .logo{
        width:100%;
    }

    .search-box{
        order:3;
        flex-basis:100%;
    }

    .header-actions{
        margin-left:auto;
    }

    .hero-inner{
        flex-direction:column;
        align-items:flex-start;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .product-image{
        height:170px;
    }

    .product-content{
        padding:10px;
    }

    .product-actions{
        grid-template-columns:1fr 1fr;
    }

    .message-btn{
        grid-column:1/-1;
    }
}

@media(max-width:480px){
    .products{
        grid-template-columns:1fr;
    }

    .product-image{
        height:220px;
    }

    .filter-panel{
        grid-template-columns:1fr;
    }

    .filter-btn{
        padding:11px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">
            <div class="logo-icon">🇿🇲</div>
            <div>
                <div class="logo-text">SiomaMarket</div>
                <div class="logo-sub">BUY • SELL • CONNECT</div>
            </div>
        </div>

        <div class="search-box">
            <input id="topSearch" type="search" placeholder="Search products...">
            <button onclick="applyFilters()">🔎</button>
        </div>

        <div class="header-actions">
            <button class="header-btn" onclick="openAuthModal()">Account</button>
            <button class="header-btn" onclick="openSellModal()">+ Sell</button>
        </div>

    </div>
</header>

<section class="hero">
    <div class="hero-inner">
        <div>
            <h1>Buy & Sell Locally 🇿🇲</h1>
            <p>Discover products from sellers around Zambia.</p>
        </div>

        <button class="sell-btn" onclick="openSellModal()">
            + Post an Item
        </button>
    </div>
</section>

<section class="filters">
    <div class="filter-panel">

        <input
            id="searchInput"
            type="search"
            placeholder="Search products..."
            oninput="applyFilters()"
        >

        <select id="categoryFilter" onchange="applyFilters()">
            <option value="">All Categories</option>
            <option value="Phones">Phones</option>
            <option value="Electronics">Electronics</option>
            <option value="Vehicles">Vehicles</option>
            <option value="Property">Property</option>
            <option value="Fashion">Fashion</option>
            <option value="Furniture">Furniture</option>
            <option value="Agriculture">Agriculture</option>
            <option value="Jobs">Jobs</option>
            <option value="Other">Other</option>
        </select>

        <select id="locationFilter" onchange="applyFilters()">
            <option value="">All Locations</option>
            <option value="Lusaka">Lusaka</option>
            <option value="Copperbelt">Copperbelt</option>
            <option value="Southern">Southern</option>
            <option value="Central">Central</option>
            <option value="Eastern">Eastern</option>
            <option value="Western">Western</option>
            <option value="Northern">Northern</option>
            <option value="Luapula">Luapula</option>
            <option value="Muchinga">Muchinga</option>
            <option value="North-Western">North-Western</option>
        </select>

        <select id="sortFilter" onchange="applyFilters()">
            <option value="newest">Newest First</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
        </select>

        <button class="filter-btn" onclick="clearFilters()">
            Reset
        </button>

    </div>
</section>

<main>

    <div class="section-title">
        <h2>Latest Products</h2>
        <span class="results-count" id="resultsCount">Loading...</span>
    </div>

    <div id="products" class="products"></div>

</main>

<footer>
    <strong>SiomaMarket 🇿🇲</strong>
    <p style="margin-top:8px;">Zambia's local marketplace.</p>
</footer>

<!-- AUTH MODAL -->

<div class="modal" id="authModal">
    <div class="modal-box">

        <div class="modal-header">
            <h2>My Account</h2>
            <button class="close-btn" onclick="closeModal('authModal')">✕</button>
        </div>

        <div id="accountContent"></div>

    </div>
</div>

<!-- SELL MODAL -->

<div class="modal" id="sellModal">
    <div class="modal-box">

        <div class="modal-header">
            <h2>Post Product</h2>
            <button class="close-btn" onclick="closeModal('sellModal')">✕</button>
        </div>

        <form id="productForm">

            <div class="form-group">
                <label>Product Name</label>
                <input id="productName" required>
            </div>

            <div class="form-group">
                <label>Price (ZMW)</label>
                <input id="productPrice" type="number" min="0" required>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select id="productCategory" required>
                    <option value="">Select category</option>
                    <option>Phones</option>
                    <option>Electronics</option>
                    <option>Vehicles</option>
                    <option>Property</option>
                    <option>Fashion</option>
                    <option>Furniture</option>
                    <option>Agriculture</option>
                    <option>Jobs</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Location</label>
                <input id="productLocation" placeholder="e.g. Lusaka" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="productDescription" required></textarea>
            </div>

            <div class="form-group">
                <label>Image URL</label>
                <input id="productImage" placeholder="https://...">
            </div>

            <button class="primary-btn" type="submit">
                Publish Product
            </button>

        </form>

    </div>
</div>

<!-- SHARE MODAL -->

<div class="modal" id="shareModal">
    <div class="modal-box">

        <div class="modal-header">
            <h2>Share Product</h2>
            <button class="close-btn" onclick="closeModal('shareModal')">✕</button>
        </div>

        <div class="share-preview" id="sharePreview"></div>

        <div class="share-options">

            <button class="share-option" onclick="nativeShare()">
                📤 Share using your phone
            </button>

            <button class="share-option" onclick="shareWhatsApp()">
                💬 Share on WhatsApp
            </button>

            <button class="share-option" onclick="copyProductLink()">
                📋 Copy Product Link
            </button>

        </div>

    </div>
</div>

<!-- MESSAGE MODAL -->

<div class="modal" id="messageModal">
    <div class="modal-box">

        <div class="modal-header">
            <h2 id="messageTitle">Message Seller</h2>
            <button class="close-btn" onclick="closeModal('messageModal')">✕</button>
        </div>

        <div id="messageList" class="message-list"></div>

        <form id="messageForm">

            <div class="form-group">
                <textarea
                    id="messageText"
                    placeholder="Write your message..."
                    required
                ></textarea>
            </div>

            <button class="primary-btn">
                Send Message
            </button>

        </form>

    </div>
</div>

<div id="toast" class="toast"></div>

<script>

/* =========================================================
   SUPABASE
   KEEP YOUR EXISTING V2 CREDENTIALS HERE
========================================================= */

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

const { createClient } =
    supabase;

const db = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =========================================================
   STATE
========================================================= */

let allProducts = [];
let filteredProducts = [];
let currentUser = null;

let selectedShareProduct = null;
let selectedMessageProduct = null;


/* =========================================================
   START
========================================================= */

document.addEventListener("DOMContentLoaded", async () => {

    await checkUser();

    await loadProducts();

    document.getElementById("topSearch")
        .addEventListener("input", function(){

            document.getElementById("searchInput").value =
                this.value;

            applyFilters();

        });

});


/* =========================================================
   AUTH
========================================================= */

async function checkUser(){

    const { data } = await db.auth.getUser();

    currentUser = data.user || null;

    updateAccountButton();
}


function updateAccountButton(){

    const buttons =
        document.querySelectorAll(".header-btn");

    if(!buttons.length) return;

    if(currentUser){

        buttons[0].textContent =
            "👤 My Account";

    }else{

        buttons[0].textContent =
            "Login";

    }
}


function openAuthModal(){

    const content =
        document.getElementById("accountContent");

    if(currentUser){

        content.innerHTML = `

            <p style="margin-bottom:15px;">
                Logged in as:
                <strong>${escapeHTML(currentUser.email || "")}</strong>
            </p>

            <button class="primary-btn"
                onclick="logout()">
                Logout
            </button>
        `;

    }else{

        content.innerHTML = `

            <div class="auth-tabs">

                <button
                    class="auth-tab active"
                    onclick="showLogin()">
                    Login
                </button>

                <button
                    class="auth-tab"
                    onclick="showSignup()">
                    Register
                </button>

            </div>

            <div id="authForm"></div>
        `;

        showLogin();

    }

    openModal("authModal");
}


function showLogin(){

    document.getElementById("authForm").innerHTML = `

        <div class="form-group">
            <label>Email</label>
            <input id="loginEmail" type="email">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input id="loginPassword" type="password">
        </div>

        <button class="primary-btn"
            onclick="login()">
            Login
        </button>
    `;
}


function showSignup(){

    document.getElementById("authForm").innerHTML = `

        <div class="form-group">
            <label>Email</label>
            <input id="signupEmail" type="email">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input id="signupPassword" type="password">
        </div>

        <button class="primary-btn"
            onclick="signup()">
            Create Account
        </button>
    `;
}


async function login(){

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const { error } =
        await db.auth.signInWithPassword({
            email,
            password
        });

    if(error){

        showToast(error.message);
        return;

    }

    await checkUser();

    closeModal("authModal");

    showToast("Login successful");

}


async function signup(){

    const email =
        document.getElementById("signupEmail").value.trim();

    const password =
        document.getElementById("signupPassword").value;

    const { error } =
        await db.auth.signUp({
            email,
            password
        });

    if(error){

        showToast(error.message);
        return;

    }

    showToast(
        "Account created. Check your email if confirmation is required."
    );

}


async function logout(){

    await db.auth.signOut();

    currentUser = null;

    updateAccountButton();

    closeModal("authModal");

    showToast("Logged out");

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

    const container =
        document.getElementById("products");

    container.innerHTML =
        `<div class="empty">Loading products...</div>`;

    /*
       This expects a products table.

       Supported columns:
       id
       name
       price
       category
       location
       description
       image_url
       seller_id
       seller_name
       created_at
    */

    const { data, error } = await db
        .from("products")
        .select("*")
        .order("created_at", {
            ascending:false
        });

    if(error){

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                <h3>Unable to load products</h3>
                <p style="margin-top:8px;">
                    Check your Supabase products table and credentials.
                </p>
            </div>
        `;

        return;
    }

    allProducts = data || [];

    applyFilters();

}


/* =========================================================
   FILTERS
========================================================= */

function applyFilters(){

    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const category =
        document.getElementById("categoryFilter").value;

    const location =
        document.getElementById("locationFilter").value;

    const sort =
        document.getElementById("sortFilter").value;


    filteredProducts =
        allProducts.filter(product => {

            const text = [

                product.name,
                product.description,
                product.category,
                product.location,
                product.seller_name

            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


            const matchesSearch =
                !search ||
                text.includes(search);


            const matchesCategory =
                !category ||
                String(product.category || "")
                .toLowerCase() ===
                category.toLowerCase();


            const matchesLocation =
                !location ||
                String(product.location || "")
                .toLowerCase()
                .includes(location.toLowerCase());


            return (
                matchesSearch &&
                matchesCategory &&
                matchesLocation
            );

        });


    if(sort === "low"){

        filteredProducts.sort(
            (a,b) =>
                Number(a.price || 0) -
                Number(b.price || 0)
        );

    }else if(sort === "high"){

        filteredProducts.sort(
            (a,b) =>
                Number(b.price || 0) -
                Number(a.price || 0)
        );

    }else{

        filteredProducts.sort(
            (a,b) =>
                new Date(b.created_at || 0) -
                new Date(a.created_at || 0)
        );

    }


    renderProducts();

}


function clearFilters(){

    document.getElementById("searchInput").value = "";

    document.getElementById("topSearch").value = "";

    document.getElementById("categoryFilter").value = "";

    document.getElementById("locationFilter").value = "";

    document.getElementById("sortFilter").value = "newest";

    applyFilters();

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(){

    const container =
        document.getElementById("products");

    document.getElementById("resultsCount")
        .textContent =
        `${filteredProducts.length} product${filteredProducts.length === 1 ? "" : "s"}`;


    if(!filteredProducts.length){

        container.innerHTML = `
            <div class="empty">
                <h3>No products found</h3>
                <p style="margin-top:8px;">
                    Try changing your search or filters.
                </p>
            </div>
        `;

        return;
    }


    container.innerHTML =
        filteredProducts.map(product =>
            productCard(product)
        ).join("");

}


function productCard(product){

    const image =
        product.image_url ||
        "https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=900&q=80";


    const favorite =
        isFavorite(product.id);


    return `

        <article class="product-card">

            <img
                class="product-image"
                src="${escapeAttribute(image)}"
                alt="${escapeAttribute(product.name || "Product")}"
                onerror="this.src='https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=900&q=80'"
            >

            <div class="product-content">

                <div class="product-title">
                    ${escapeHTML(product.name || "Unnamed Product")}
                </div>

                <div class="product-price">
                    K${formatNumber(product.price)}
                </div>

                <div class="product-location">
                    📍 ${escapeHTML(product.location || "Zambia")}
                </div>

                <div class="product-seller">
                    👤 ${escapeHTML(product.seller_name || "Seller")}
                </div>

                <div class="product-actions">

                    <button
                        class="action-btn favorite ${favorite ? "active" : ""}"
                        onclick="toggleFavorite('${escapeAttribute(product.id)}')">

                        ${favorite ? "❤️ Saved" : "♡ Save"}

                    </button>


                    <!-- NEW SHARE BUTTON -->

                    <button
                        class="action-btn share-btn"
                        onclick="openShare('${escapeAttribute(product.id)}')">

                        📤 Share

                    </button>


                    <button
                        class="action-btn message-btn"
                        onclick="openMessage('${escapeAttribute(product.id)}')">

                        💬 Message

                    </button>

                </div>

            </div>

        </article>

    `;

}


/* =========================================================
   SHARE FEATURE
========================================================= */

function openShare(productId){

    const product =
        allProducts.find(
            p => String(p.id) === String(productId)
        );

    if(!product) return;

    selectedShareProduct = product;


    const link =
        createProductLink(product);


    document.getElementById("sharePreview")
        .innerHTML = `

        <strong>
            ${escapeHTML(product.name || "Product")}
        </strong>

        <br>

        K${formatNumber(product.price)}

        <br><br>

        <span style="word-break:break-all;">
            ${escapeHTML(link)}
        </span>
    `;


    openModal("shareModal");

}


/*
   Creates a link that points to the current SiomaMarket
   page and stores the product ID in the URL.
*/

function createProductLink(product){

    try{

        const url =
            new URL(window.location.href);

        url.searchParams.set(
            "product",
            product.id
        );

        return url.toString();

    }catch(e){

        return window.location.href;

    }

}


/*
   PHONE'S NATIVE SHARE MENU
*/

async function nativeShare(){

    if(!selectedShareProduct) return;

    const product =
        selectedShareProduct;

    const link =
        createProductLink(product);

    const text =
        `Check out ${product.name} on SiomaMarket 🇿🇲 - K${formatNumber(product.price)}`;


    if(navigator.share){

        try{

            await navigator.share({

                title:
                    `${product.name} | SiomaMarket`,

                text:
                    text,

                url:
                    link

            });

            closeModal("shareModal");

        }catch(error){

            /*
               User may have cancelled the share menu.
            */

            console.log("Share cancelled");

        }

    }else{

        await copyText(link);

        showToast(
            "Sharing is not supported. Product link copied!"
        );

    }

}


/*
   WHATSAPP SHARE
*/

function shareWhatsApp(){

    if(!selectedShareProduct) return;

    const product =
        selectedShareProduct;

    const link =
        createProductLink(product);

    const text =
        `🇿🇲 Check out this product on SiomaMarket!\n\n` +
        `${product.name}\n` +
        `Price: K${formatNumber(product.price)}\n` +
        `Location: ${product.location || "Zambia"}\n\n` +
        `${link}`;


    const whatsappUrl =
        "https://wa.me/?text=" +
        encodeURIComponent(text);


    window.open(
        whatsappUrl,
        "_blank",
        "noopener,noreferrer"
    );

}


/*
   COPY LINK
*/

async function copyProductLink(){

    if(!selectedShareProduct) return;

    const link =
        createProductLink(selectedShareProduct);

    await copyText(link);

    closeModal("shareModal");

    showToast("Product link copied!");

}


async function copyText(text){

    try{

        await navigator.clipboard.writeText(text);

    }catch(error){

        const textarea =
            document.createElement("textarea");

        textarea.value = text;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

    }

}


/* =========================================================
   FAVORITES
========================================================= */

function getFavorites(){

    try{

        return JSON.parse(
            localStorage.getItem("siomamarket_favorites") || "[]"
        );

    }catch(e){

        return [];

    }

}


function saveFavorites(list){

    localStorage.setItem(
        "siomamarket_favorites",
        JSON.stringify(list)
    );

}


function isFavorite(id){

    return getFavorites()
        .map(String)
        .includes(String(id));

}


function toggleFavorite(id){

    const favorites =
        getFavorites();

    const index =
        favorites.map(String)
        .indexOf(String(id));


    if(index >= 0){

        favorites.splice(index,1);

        showToast("Removed from favorites");

    }else{

        favorites.push(id);

        showToast("Added to favorites ❤️");

    }


    saveFavorites(favorites);

    renderProducts();

}


/* =========================================================
   SELL PRODUCT
========================================================= */

function openSellModal(){

    if(!currentUser){

        showToast(
            "Please login before posting a product."
        );

        openAuthModal();

        return;

    }

    openModal("sellModal");

}


document.getElementById("productForm")
.addEventListener("submit", async function(e){

    e.preventDefault();


    if(!currentUser){

        showToast("Please login first.");

        return;

    }


    const product = {

        name:
            document.getElementById("productName")
            .value
            .trim(),

        price:
            Number(
                document.getElementById("productPrice")
                .value
            ),

        category:
            document.getElementById("productCategory")
            .value,

        location:
            document.getElementById("productLocation")
            .value
            .trim(),

        description:
            document.getElementById("productDescription")
            .value
            .trim(),

        image_url:
            document.getElementById("productImage")
            .value
            .trim(),

        seller_id:
            currentUser.id,

        seller_name:
            currentUser.email,

        created_at:
            new Date().toISOString()

    };


    const { error } =
        await db
        .from("products")
        .insert(product);


    if(error){

        console.error(error);

        showToast(error.message);

        return;

    }


    document.getElementById("productForm")
        .reset();

    closeModal("sellModal");

    showToast(
        "Product published successfully!"
    );

    await loadProducts();

});


/* =========================================================
   MESSAGING
========================================================= */

async function openMessage(productId){

    if(!currentUser){

        showToast(
            "Please login to message the seller."
        );

        openAuthModal();

        return;

    }


    const product =
        allProducts.find(
            p => String(p.id) === String(productId)
        );


    if(!product) return;


    selectedMessageProduct =
        product;


    document.getElementById("messageTitle")
        .textContent =
        `Message ${product.seller_name || "Seller"}`;


    openModal("messageModal");

    await loadMessages();

}


async function loadMessages(){

    if(!selectedMessageProduct ||
       !currentUser) return;


    const sellerId =
        selectedMessageProduct.seller_id;


    const { data, error } =
        await db
        .from("messages")
        .select("*")
        .or(
            `and(sender_id.eq.${currentUser.id},receiver_id.eq.${sellerId}),` +
            `and(sender_id.eq.${sellerId},receiver_id.eq.${currentUser.id})`
        )
        .order("created_at", {
            ascending:true
        });


    const container =
        document.getElementById("messageList");


    if(error){

        console.log(error);

        container.innerHTML = `
            <div style="padding:15px;text-align:center;color:#667085;">
                Start a conversation with the seller.
            </div>
        `;

        return;

    }


    if(!data || !data.length){

        container.innerHTML = `
            <div style="padding:15px;text-align:center;color:#667085;">
                No messages yet. Send the first message.
            </div>
        `;

        return;

    }


    container.innerHTML =
        data.map(message => `

            <div class="message ${
                String(message.sender_id) ===
                String(currentUser.id)
                ? "mine"
                : ""
            }">

                ${escapeHTML(message.message || "")}

            </div>

        `).join("");


    container.scrollTop =
        container.scrollHeight;

}


document.getElementById("messageForm")
.addEventListener("submit", async function(e){

    e.preventDefault();


    if(!currentUser ||
       !selectedMessageProduct){

        return;

    }


    const text =
        document.getElementById("messageText")
        .value
        .trim();


    if(!text) return;


    const receiverId =
        selectedMessageProduct.seller_id;


    if(String(receiverId) ===
       String(currentUser.id)){

        showToast(
            "You cannot message yourself."
        );

        return;

    }


    const { error } =
        await db
        .from("messages")
        .insert({

            sender_id:
                currentUser.id,

            receiver_id:
                receiverId,

            product_id:
                selectedMessageProduct.id,

            message:
                text,

            created_at:
                new Date().toISOString()

        });


    if(error){

        console.error(error);

        showToast(error.message);

        return;

    }


    document.getElementById("messageText")
        .value = "";


    await loadMessages();

});


/* =========================================================
   MODALS
========================================================= */

function openModal(id){

    document.getElementById(id)
        .classList.add("show");

}


function closeModal(id){

    document.getElementById(id)
        .classList.remove("show");

}


document.querySelectorAll(".modal")
.forEach(modal => {

    modal.addEventListener("click", function(e){

        if(e.target === modal){

            modal.classList.remove("show");

        }

    });

});


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        },3000);

}


/* =========================================================
   HELPERS
========================================================= */

function formatNumber(number){

    return Number(number || 0)
        .toLocaleString("en-ZM");

}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");

}


/* =========================================================
   OPEN PRODUCT FROM SHARED LINK
========================================================= */

function checkSharedProduct(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const productId =
        params.get("product");


    if(!productId) return;


    const product =
        allProducts.find(
            p => String(p.id) === String(productId)
        );


    if(product){

        setTimeout(() => {

            openShare(product.id);

        },500);

    }

}


/* =========================================================
   SUPABASE AUTH STATE
========================================================= */

db.auth.onAuthStateChange(
    async (event, session) => {

        currentUser =
            session?.user || null;

        updateAccountButton();

    }
);
